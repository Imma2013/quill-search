services:
  - type: web
    name: quill-api
    env: node
    region: oregon
    rootDir: apps/api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SEARXNG_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: CONVEX_URL
        sync: false
      - key: CONVEX_SEARCH_TOKEN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
  - type: pserv
    name: quill-searx
    env: docker
    region: oregon
    plan: starter
    rootDir: infra/searxng
    envVars:
      - key: SEARXNG_SECRET
        generateValue: true
      - key: SEARXNG_LIMITER
        value: "false"
