services:
  - type: web
    name: quill-api
    env: docker
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SEARXNG_URL
        value: http://127.0.0.1:8080
      - key: SEARXNG_SECRET
        generateValue: true
      - key: SEARXNG_LIMITER
        value: "false"
      - key: ALLOWED_ORIGIN
        sync: false
      - key: CONVEX_URL
        sync: false
      - key: CONVEX_SEARCH_TOKEN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
